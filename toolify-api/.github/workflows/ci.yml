name: CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolify-api
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'   # adjust if your csproj targets net8.0
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test (if any)
        run: |
          if [ -d "../tests" ]; then dotnet test -c Release --no-build; else echo "no tests"; fi

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool-portal-app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tool-portal-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (if present)
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
